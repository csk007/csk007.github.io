<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Spelling Bee - Share Config</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a73e8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        textarea { height: 80px; resize: none; }
        
        .settings-row { display: flex; gap: 20px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .slider-group { flex: 1; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .slider-val { font-size: 0.8em; color: #1a73e8; float: right; }

        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        button { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .btn-start { background: #1a73e8; color: white; }
        .btn-save { background: #34a853; color: white; }
        .btn-share { background: #f39c12; color: white; }
        .btn-review { background: #9b59b6; color: white; margin-top: 10px; width: 100%; }
        .btn-finish { background: #1a73e8; color: white; margin-top: 20px; width: 100%; }
        
        #timer-display { text-align: right; font-weight: bold; color: #d93025; font-family: monospace; font-size: 1.2em; margin-bottom: 10px; }
        .word-row { display: flex; align-items: center; margin-bottom: 15px; gap: 12px; }
        .serial-number { font-weight: bold; min-width: 25px; color: #5f6368; }
        .word-input { padding: 10px; border: 2px solid #ccc; border-radius: 6px; flex-grow: 1; font-size: 16px; }
        .correct { border-color: #34a853 !important; background-color: #e6f4ea; }
        .wrong { border-color: #d93025 !important; background-color: #fce8e6; }
        #score-display { font-weight: bold; font-size: 1.2em; text-align: center; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spelling Game</h1>

    <div id="setup-section">
        <div class="form-group">
            <label>List Title:</label>
            <input type="text" id="list-title" placeholder="e.g., Science Quiz">
        </div>
        <div class="form-group">
            <label>Words:</label>
            <textarea id="word-input-area" placeholder="space or comma separated..."></textarea>
        </div>

        <div class="settings-row">
            <div class="slider-group">
                <label>Speed <span id="speed-val" class="slider-val">1.0x</span></label>
                <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1" oninput="updateSliderLabels()">
            </div>
            <div class="slider-group">
                <label>Pitch <span id="pitch-val" class="slider-val">1.0</span></label>
                <input type="range" id="speech-pitch" min="0.1" max="2" step="0.1" value="1" oninput="updateSliderLabels()">
            </div>
        </div>

        <div class="controls">
            <button class="btn-save" onclick="saveList()">Save Locally</button>
            <button class="btn-share" onclick="generateShareLink()">Copy Share Link</button>
            <button class="btn-start" onclick="startGame()">Start Game</button>
        </div>
        <div class="form-group" style="margin-top:20px;">
            <select id="saved-lists-dropdown" onchange="loadSelectedList()">
                <option value="">-- Load My Saved Lists --</option>
            </select>
        </div>
    </div>

    <div id="game-section" class="hidden">
        <div id="timer-display">Time: 00:00</div>
        <h2 id="current-game-title" style="text-align: center;"></h2>
        <div id="word-list-container"></div>
        <button class="btn-finish" onclick="finishGame()">Finish</button>
        <div id="score-display"></div>
        <button id="review-btn" class="btn-review hidden" onclick="startReview()">Review Mistakes</button>
        <button onclick="resetGame()" style="background:#dadce0; margin-top: 10px; width:100%; border:none; padding:10px; border-radius:6px; cursor:pointer;">Main Menu</button>
    </div>
</div>

<script>
    let targetWords = [];
    let missedWords = [];
    let savedData = JSON.parse(localStorage.getItem('spellingGameData') || '[]');
    let startTime, timerInterval;

    window.onload = () => { 
        updateDropdown(); 
        checkURLParams(); 
    };

    function updateSliderLabels() {
        document.getElementById('speed-val').innerText = document.getElementById('speech-rate').value + 'x';
        document.getElementById('pitch-val').innerText = document.getElementById('speech-pitch').value;
    }

    function checkURLParams() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('words')) {
            document.getElementById('word-input-area').value = decodeURIComponent(urlParams.get('words'));
            document.getElementById('list-title').value = decodeURIComponent(urlParams.get('title') || '');
            
            // Apply shared voice settings
            if (urlParams.get('rate')) document.getElementById('speech-rate').value = urlParams.get('rate');
            if (urlParams.get('pitch')) document.getElementById('speech-pitch').value = urlParams.get('pitch');
            updateSliderLabels();
        }
    }

    function generateShareLink() {
        const wordsRaw = document.getElementById('word-input-area').value;
        // Cleanup: remove extra whitespace and newlines
        const wordsClean = wordsRaw.split(/[ ,]+/).filter(w => w.length > 0).join(',');
        const title = document.getElementById('list-title').value.trim();
        const rate = document.getElementById('speech-rate').value;
        const pitch = document.getElementById('speech-pitch').value;

        if (!wordsClean) return alert("Enter words first!");

        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?words=${encodeURIComponent(wordsClean)}&title=${encodeURIComponent(title)}&rate=${rate}&pitch=${pitch}`;
        
        navigator.clipboard.writeText(shareUrl).then(() => {
            alert("Configuration link copied! This includes your words, title, and voice settings.");
        });
    }

    function saveList() {
        const title = document.getElementById('list-title').value || "Untitled";
        const words = document.getElementById('word-input-area').value;
        if (!words.trim()) return;
        savedData.push({ id: Date.now(), title, words, time: new Date().toLocaleString() });
        localStorage.setItem('spellingGameData', JSON.stringify(savedData));
        updateDropdown();
        alert("List saved to your browser!");
    }

    function updateDropdown() {
        const dropdown = document.getElementById('saved-lists-dropdown');
        dropdown.innerHTML = '<option value="">-- Load My Saved Lists --</option>';
        savedData.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = `${item.title} (${item.time})`;
            dropdown.appendChild(opt);
        });
    }

    function loadSelectedList() {
        const list = savedData.find(item => item.id == document.getElementById('saved-lists-dropdown').value);
        if (list) {
            document.getElementById('list-title').value = list.title;
            document.getElementById('word-input-area').value = list.words;
        }
    }

    function startGame(wordsToUse = null) {
        const input = wordsToUse || document.getElementById('word-input-area').value;
        targetWords = wordsToUse ? wordsToUse.split(',') : input.split(/[ ,]+/).filter(w => w.length > 0);
        if (targetWords.length === 0) return alert("Please add some words!");

        document.getElementById('current-game-title').innerText = wordsToUse ? "Review Mode" : (document.getElementById('list-title').value || "Spelling Test");
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('review-btn').classList.add('hidden');
        document.getElementById('score-display').innerText = '';

        const container = document.getElementById('word-list-container');
        container.innerHTML = '';
        targetWords.forEach((word, index) => {
            const row = document.createElement('div');
            row.className = 'word-row';
            row.innerHTML = `<span class="serial-number">${index + 1}.</span>
                <button style="min-width:40px; cursor:pointer; background:#eee; border:1px solid #ccc; border-radius:4px;" onclick="speakWord('${word}')">🔊</button>
                <input type="text" class="word-input" id="guess-${index}" autocomplete="off" placeholder="...">`;
            container.appendChild(row);
        });
        startTimer();
    }

    function startTimer() {
        let seconds = 0;
        document.getElementById('timer-display').innerText = "Time: 00:00";
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `Time: ${mins}:${secs}`;
        }, 1000);
    }

    function speakWord(word) { 
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = document.getElementById('speech-rate').value;
        utterance.pitch = document.getElementById('speech-pitch').value;
        window.speechSynthesis.speak(utterance); 
    }

    function finishGame() {
        clearInterval(timerInterval);
        let score = 0;
        missedWords = [];
        targetWords.forEach((word, index) => {
            const input = document.getElementById(`guess-${index}`);
            if (input.value.trim().toLowerCase() === word.toLowerCase()) {
                input.className = 'word-input correct'; score++;
            } else {
                input.className = 'word-input wrong'; 
                input.value += ` (Correct: ${word})`;
                missedWords.push(word);
            }
        });
        document.getElementById('score-display').innerText = `Final Score: ${score}/${targetWords.length}`;
        if (missedWords.length > 0) document.getElementById('review-btn').classList.remove('hidden');
    }

    function startReview() { startGame(missedWords.join(',')); }

    function resetGame() {
        clearInterval(timerInterval);
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('game-section').classList.add('hidden');
    }
</script>

</body>
            </html>
