<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Spelling Bee Game</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        textarea { height: 80px; resize: none; }
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; transition: 0.2s; }
        .btn-start { background: #1a73e8; color: white; }
        .btn-save { background: #34a853; color: white; }
        .btn-finish { background: #1a73e8; color: white; margin-top: 20px; }
        button:hover { opacity: 0.9; }
        .hidden { display: none; }
        
        /* Serial Number Styling */
        .word-row { display: flex; align-items: center; margin-bottom: 15px; gap: 12px; }
        .serial-number { font-weight: bold; min-width: 25px; color: #5f6368; }
        
        .word-input { padding: 10px; border: 2px solid #ccc; border-radius: 6px; flex-grow: 1; font-size: 16px; }
        .correct { border-color: #34a853 !important; background-color: #e6f4ea; }
        .wrong { border-color: #d93025 !important; background-color: #fce8e6; }
        #score-display { font-weight: bold; font-size: 1.3em; text-align: center; margin-top: 20px; }
        .btn-play { background: #f8f9fa; border: 1px solid #dadce0; color: #3c4043; min-width: 50px; }
        .saved-section { border-top: 1px solid #eee; margin-top: 20px; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spelling Game</h1>

    <div id="setup-section">
        <div class="form-group">
            <label>List Title (optional):</label>
            <input type="text" id="list-title" placeholder="e.g., Science Vocabulary">
        </div>
        
        <div class="form-group">
            <label>Words (separated by spaces or commas):</label>
            <textarea id="word-input-area" placeholder="galaxy atom molecule..."></textarea>
        </div>

        <div class="controls">
            <button class="btn-save" onclick="saveList()">Save List</button>
            <button class="btn-start" onclick="startGame()">Start Game</button>
        </div>

        <div class="saved-section">
            <label>Load a saved list:</label>
            <select id="saved-lists-dropdown" onchange="loadSelectedList()">
                <option value="">-- Select a saved list --</option>
            </select>
        </div>
    </div>

    <div id="game-section" class="hidden">
        <h2 id="current-game-title" style="text-align: center;"></h2>
        <div id="word-list-container"></div>
        <button class="btn-finish" onclick="finishGame()">Finish & Score</button>
        <button onclick="resetGame()" style="background:#dadce0; color:#3c4043; margin-top: 10px;">Back to Menu</button>
        <div id="score-display"></div>
    </div>
</div>

<script>
    let targetWords = [];
    let savedData = JSON.parse(localStorage.getItem('spellingGameData') || '[]');

    window.onload = updateDropdown;

    function saveList() {
        const title = document.getElementById('list-title').value || "Untitled List";
        const content = document.getElementById('word-input-area').value;
        const timestamp = new Date().toLocaleString();

        if (!content.trim()) return alert("Please enter words to save.");

        const newList = {
            id: Date.now(),
            title: title,
            words: content,
            time: timestamp
        };

        savedData.push(newList);
        localStorage.setItem('spellingGameData', JSON.stringify(savedData));
        updateDropdown();
        alert("List saved!");
    }

    function updateDropdown() {
        const dropdown = document.getElementById('saved-lists-dropdown');
        dropdown.innerHTML = '<option value="">-- Select a saved list --</option>';
        savedData.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = `${item.title} (${item.time})`;
            dropdown.appendChild(option);
        });
    }

    function loadSelectedList() {
        const selectedId = document.getElementById('saved-lists-dropdown').value;
        const list = savedData.find(item => item.id == selectedId);
        if (list) {
            document.getElementById('list-title').value = list.title;
            document.getElementById('word-input-area').value = list.words;
        }
    }

    function startGame() {
        const input = document.getElementById('word-input-area').value;
        if (!input.trim()) return alert("Please enter or select words.");

        targetWords = input.split(/[ ,]+/).filter(word => word.length > 0);
        document.getElementById('current-game-title').innerText = document.getElementById('list-title').value || "Spelling Test";
        
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        renderWordInputs();
    }

    function renderWordInputs() {
        const container = document.getElementById('word-list-container');
        container.innerHTML = '';
        targetWords.forEach((word, index) => {
            const row = document.createElement('div');
            row.className = 'word-row';
            row.innerHTML = `
                <span class="serial-number">${index + 1}.</span>
                <button class="btn-play" onclick="speakWord('${word}')">🔊</button>
                <input type="text" class="word-input" id="guess-${index}" autocomplete="off" placeholder="Type here...">
            `;
            container.appendChild(row);
        });
    }

    function speakWord(word) {
        const msg = new SpeechSynthesisUtterance(word);
        window.speechSynthesis.speak(msg);
    }

    function finishGame() {
        let score = 0;
        targetWords.forEach((word, index) => {
            const inputField = document.getElementById(`guess-${index}`);
            const userGuess = inputField.value.trim().toLowerCase();
            const correctWord = word.toLowerCase();
            
            if (userGuess === correctWord) {
                inputField.className = 'word-input correct';
                score++;
            } else {
                inputField.className = 'word-input wrong';
                inputField.value = `${userGuess} (Correct: ${word})`;
            }
        });
        document.getElementById('score-display').innerText = `Your Final Score: ${score} / ${targetWords.length}`;
    }

    function resetGame() {
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('game-section').classList.add('hidden');
        document.getElementById('score-display').innerText = '';
    }
</script>

</body>
</html>
