<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Guess Game</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 800px; }
        h1 { color: #2c3e50; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; resize: vertical; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 25px; display: none; }
        th, td { border: 1px solid #dfe6e9; padding: 12px; text-align: center; }
        th { background-color: #f8f9fa; color: #636e72; }
        
        .blurred { 
            filter: blur(5px); 
            background: #eee; 
            cursor: pointer; 
            user-select: none;
            transition: filter 0.3s;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .blurred:hover { filter: blur(2px); }
        .revealed { filter: blur(0) !important; background: transparent; }
        
        .play-btn { background-color: #2ecc71; font-size: 0.9rem; }
        .play-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spell Guess Game</h1>
    <p>Paste your comma-separated words below:</p>
    <textarea id="wordInput" placeholder="stood, against, two-storeyed..."></textarea>
    <center><button onclick="generateTable()">Create Game Table</button></center>

    <table id="gameTable">
        <thead>
            <tr>
                <th>S.No</th>
                <th>Listen</th>
                <th>Word (Click to Reveal)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    function generateTable() {
        const input = document.getElementById('wordInput').value;
        const table = document.getElementById('gameTable');
        const tbody = document.getElementById('tableBody');
        
        // Split by comma, trim whitespace, and filter out empty strings
        const words = input.split(',').map(w => w.trim()).filter(w => w.length > 0);

        if (words.length === 0) {
            alert("Please enter some words first!");
            return;
        }

        tbody.innerHTML = ''; // Clear previous table rows
        
        words.forEach((word, index) => {
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><button class="play-btn" onclick="speak('${word.replace(/'/g, "\\'")}')">🔊 Play</button></td>
                <td><span class="blurred" onclick="this.classList.toggle('revealed')">${word}</span></td>
            `;
            tbody.appendChild(row);
        });

        table.style.display = 'table';
    }

    function speak(word) {
        // Stop any current speech
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = 0.9; // Slightly slower for clarity
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
