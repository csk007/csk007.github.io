<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Spelling Bee - Final</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #d93025; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: var(--bg); color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--primary); }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        textarea, input[type="text"], select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 100px; resize: none; }

        .input-actions { position: absolute; right: 10px; top: 35px; display: flex; gap: 5px; }
        .icon-btn { background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; padding: 4px 8px; font-size: 12px; transition: 0.2s; }
        .icon-btn:hover { background: #f8f9fa; border-color: var(--primary); }

        .settings-row { display: flex; gap: 20px; margin: 20px 0; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .slider-group { flex: 1; }
        .slider-val { font-size: 0.85em; color: var(--primary); font-weight: bold; float: right; }

        .controls { display: flex; flex-wrap: wrap; gap: 10px; }
        button.main-btn { flex: 1; min-width: 140px; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; color: white; transition: 0.3s; }
        .btn-start { background: var(--primary); }
        .btn-share { background: #f39c12; }
        .btn-clear { background: #6c757d; }
        button:hover { filter: brightness(0.9); transform: translateY(-1px); }

        /* Game UI */
        .hidden { display: none; }
        .word-row { display: flex; align-items: center; margin-bottom: 12px; gap: 12px; padding: 10px; border-radius: 8px; background: #fafafa; }
        .word-input { flex-grow: 1; padding: 10px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; }
        .correct { border-color: var(--success) !important; background-color: #e6f4ea; }
        .wrong { border-color: var(--danger) !important; background-color: #fce8e6; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; border-radius: 15px; max-width: 450px; position: relative; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td, th { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spelling Game</h1>

    <div id="setup-section">
        <div class="form-group">
            <label>List Title:</label>
            <input type="text" id="list-title" placeholder="Enter title...">
        </div>
        
        <div class="form-group">
            <label>Words List:</label>
            <div class="input-actions">
                <button class="icon-btn" onclick="showPreview()" title="Preview Words">👁️ Preview</button>
                <button class="icon-btn" onclick="clearAll()" title="Clear Everything">🗑️ Clear</button>
            </div>
            <textarea id="word-input-area" placeholder="Paste words here (cat, dog, bird)..."></textarea>
        </div>

        <div class="settings-row">
            <div class="slider-group">
                <label>Speed <span id="speed-val" class="slider-val">1.0x</span></label>
                <input type="range" id="speech-rate" min="0.5" max="1.5" step="0.1" value="1" oninput="updateLabels()">
            </div>
            <div class="slider-group">
                <label>Pitch <span id="pitch-val" class="slider-val">1.0</span></label>
                <input type="range" id="speech-pitch" min="0.5" max="1.5" step="0.1" value="1" oninput="updateLabels()">
            </div>
        </div>

        <div class="controls">
            <button class="main-btn btn-share" onclick="generateShareLink()">Share Game</button>
            <button class="main-btn btn-start" onclick="startGame()">Start Now</button>
        </div>
    </div>

    <div id="game-section" class="hidden">
        <div id="timer-display" style="text-align:right; font-weight:bold; color:var(--danger); font-family: monospace;">Time: 00:00</div>
        <h2 id="current-game-title" style="text-align: center; margin-bottom: 20px;"></h2>
        <div id="word-list-container"></div>
        <button class="main-btn btn-start" style="width:100%; margin-top:20px;" onclick="finishGame()">Finish & Score</button>
        <button onclick="resetGame()" style="background:none; border:none; color:#666; cursor:pointer; width:100%; margin-top:15px; text-decoration:underline;">Cancel Game</button>
        <div id="score-display" style="text-align:center; margin-top:20px; font-size:1.4em; font-weight:bold;"></div>
    </div>
</div>

<div id="preview-modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:24px;" onclick="closePreview()">&times;</span>
        <h3 style="margin-top:0;">Word List Preview</h3>
        <div style="max-height: 400px; overflow-y: auto;">
            <table id="preview-table">
                <thead><tr><th>#</th><th>Word</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let targetWords = [];
    let timerInterval;

    function updateLabels() {
        document.getElementById('speed-val').innerText = document.getElementById('speech-rate').value + 'x';
        document.getElementById('pitch-val').innerText = document.getElementById('speech-pitch').value;
    }

    function clearAll() {
        if(confirm("Are you sure you want to clear the title and words?")) {
            document.getElementById('word-input-area').value = "";
            document.getElementById('list-title').value = "";
        }
    }

    function showPreview() {
        const words = document.getElementById('word-input-area').value.split(/[ ,]+/).filter(w => w.length > 0);
        if (words.length === 0) return alert("Nothing to preview.");
        const tbody = document.querySelector("#preview-table tbody");
        tbody.innerHTML = words.map((w, i) => `<tr><td>${i+1}</td><td>${w}</td></tr>`).join('');
        document.getElementById('preview-modal').style.display = "block";
    }

    function closePreview() { document.getElementById('preview-modal').style.display = "none"; }

    function generateShareLink() {
        const words = document.getElementById('word-input-area').value.split(/[ ,]+/).filter(w => w.length > 0).join(',');
        const title = document.getElementById('list-title').value.trim();
        const rate = document.getElementById('speech-rate').value;
        const pitch = document.getElementById('speech-pitch').value;
        if (!words) return alert("Enter words first!");
        const url = `${window.location.origin}${window.location.pathname}?words=${encodeURIComponent(words)}&title=${encodeURIComponent(title)}&rate=${rate}&pitch=${pitch}`;
        navigator.clipboard.writeText(url).then(() => alert("Share link copied to clipboard!"));
    }

    function startGame() {
        targetWords = document.getElementById('word-input-area').value.split(/[ ,]+/).filter(w => w.length > 0);
        if (targetWords.length === 0) return alert("Please enter words.");
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('current-game-title').innerText = document.getElementById('list-title').value || "Spelling Challenge";
        
        const container = document.getElementById('word-list-container');
        container.innerHTML = targetWords.map((word, i) => `
            <div class="word-row">
                <span style="font-weight:bold; width:20px;">${i+1}.</span>
                <button onclick="speak('${word}')" style="cursor:pointer; padding:5px 10px; border-radius:4px; border:1px solid #ddd;">🔊 Listen</button>
                <input type="text" class="word-input" id="guess-${i}" autocomplete="off" placeholder="Your spelling...">
            </div>
        `).join('');
        
        let sec = 0;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            sec++;
            document.getElementById('timer-display').innerText = `Time: ${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
        }, 1000);
    }

    function speak(word) {
        const utt = new SpeechSynthesisUtterance(word);
        utt.rate = document.getElementById('speech-rate').value;
        utt.pitch = document.getElementById('speech-pitch').value;
        window.speechSynthesis.speak(utt);
    }

    function finishGame() {
        clearInterval(timerInterval);
        let score = 0;
        targetWords.forEach((word, i) => {
            const el = document.getElementById(`guess-${i}`);
            if (el.value.trim().toLowerCase() === word.toLowerCase()) {
                el.className = 'word-input correct'; score++;
            } else {
                el.className = 'word-input wrong'; el.value += ` (Correct: ${word})`;
            }
        });
        document.getElementById('score-display').innerHTML = `Score: ${score} / ${targetWords.length}<br><span style="font-size:0.6em; color:#666;">Test Complete</span>`;
    }

    function resetGame() {
        clearInterval(timerInterval);
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('game-section').classList.add('hidden');
        document.getElementById('score-display').innerText = "";
    }

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('words')) {
            document.getElementById('word-input-area').value = decodeURIComponent(params.get('words'));
            document.getElementById('list-title').value = decodeURIComponent(params.get('title') || '');
            document.getElementById('speech-rate').value = params.get('rate') || 1;
            document.getElementById('speech-pitch').value = params.get('pitch') || 1;
            updateLabels();
        }
    };
</script>
</body>
</html>
