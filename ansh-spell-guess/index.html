<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Spelling Bee - Master</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --whatsapp: #25d366; --danger: #d93025; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: var(--bg); color: #333; overflow-x: hidden; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; z-index: 2; }
        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        
        textarea, input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 100px; resize: vertical; }

        .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 8px; }
        .tool-btn { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .tool-btn:hover { border-color: var(--primary); color: var(--primary); background: #f1f8ff; }

        .settings-row { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .slider-row { display: flex; gap: 20px; }
        .slider-group { flex: 1; }
        .slider-val { font-size: 0.85em; color: var(--primary); font-weight: bold; float: right; }
        
        .shuffle-toggle { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9em; cursor: pointer; padding: 5px; }
        .shuffle-toggle input { width: 18px; height: 18px; cursor: pointer; }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        .btn-group { display: flex; gap: 10px; }
        button.main-btn { flex: 1; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; color: white; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .btn-start { background: var(--primary); }
        .btn-copy { background: #6c757d; }
        .btn-whatsapp { background: var(--whatsapp); }

        .hidden { display: none; }
        .word-row { display: flex; align-items: center; margin-bottom: 12px; gap: 12px; padding: 10px; border-radius: 8px; background: #fafafa; border: 1px solid #eee; }
        .word-input { flex-grow: 1; padding: 10px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; }
        .correct { border-color: var(--success) !important; background-color: #e6f4ea; }
        .wrong { border-color: var(--danger) !important; background-color: #fce8e6; }
        
        /* Confetti Piece */
        .confetti { position: fixed; width: 10px; height: 10px; background-color: #f00; z-index: 1; top: -10px; border-radius: 2px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; border-radius: 15px; max-width: 450px; position: relative; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spelling Game</h1>

    <div id="setup-section">
        <div class="form-group">
            <label>List Title</label>
            <input type="text" id="list-title" placeholder="e.g., Final Exam List">
        </div>
        
        <div class="form-group">
            <div class="toolbar">
                <button class="tool-btn" onclick="showPreview()">👁️ Preview List</button>
                <button class="tool-btn" style="color:var(--danger)" onclick="clearAll()">🗑️ Clear</button>
            </div>
            <label>Enter Words</label>
            <textarea id="word-input-area" placeholder="Separate words with spaces or commas..."></textarea>
        </div>

        <div class="settings-row">
            <div class="slider-row">
                <div class="slider-group">
                    <label>Speed <span id="speed-val" class="slider-val">1.0x</span></label>
                    <input type="range" id="speech-rate" min="0.5" max="1.5" step="0.1" value="1" oninput="updateLabels()">
                </div>
                <div class="slider-group">
                    <label>Pitch <span id="pitch-val" class="slider-val">1.0</span></label>
                    <input type="range" id="speech-pitch" min="0.5" max="1.5" step="0.1" value="1" oninput="updateLabels()">
                </div>
            </div>
            <label class="shuffle-toggle">
                <input type="checkbox" id="shuffle-check"> 🔀 Shuffle word order on start
            </label>
        </div>

        <div class="controls">
            <button class="main-btn btn-start" onclick="startGame()">▶ Start Test</button>
            <div class="btn-group">
                <button class="main-btn btn-copy" onclick="generateShareLink(false)">🔗 Copy Link</button>
                <button class="main-btn btn-whatsapp" onclick="generateShareLink(true)">📱 WhatsApp</button>
            </div>
        </div>
    </div>

    <div id="game-section" class="hidden">
        <div id="timer-display" style="text-align:right; font-weight:bold; color:var(--danger); margin-bottom:10px;">Time: 00:00</div>
        <h2 id="current-game-title" style="text-align: center; margin-bottom: 20px;"></h2>
        <div id="word-list-container"></div>
        <button class="main-btn btn-start" style="width:100%; margin-top:20px;" onclick="finishGame()">Check Answers</button>
        <button onclick="resetGame()" style="background:none; border:none; color:#666; cursor:pointer; width:100%; margin-top:15px; text-decoration:underline;">Back to Setup</button>
        <div id="score-display" style="text-align:center; margin-top:20px;"></div>
    </div>
</div>

<div id="preview-modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:24px;" onclick="closePreview()">&times;</span>
        <h3 style="margin-top:0;">Word List Preview</h3>
        <div style="max-height: 400px; overflow-y: auto;">
            <table style="width:100%; border-collapse: collapse;">
                <thead><tr><th align="left">#</th><th align="left">Word</th></tr></thead>
                <tbody id="preview-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let targetWords = [];
    let timerInterval;

    function updateLabels() {
        document.getElementById('speed-val').innerText = document.getElementById('speech-rate').value + 'x';
        document.getElementById('pitch-val').innerText = document.getElementById('speech-pitch').value;
    }

    function clearAll() {
        if(confirm("Clear title and words?")) {
            document.getElementById('word-input-area').value = "";
            document.getElementById('list-title').value = "";
        }
    }

    function showPreview() {
        const words = document.getElementById('word-input-area').value.split(/[ ,]+/).filter(w => w.length > 0);
        if (words.length === 0) return alert("Enter words first!");
        const tbody = document.getElementById("preview-body");
        tbody.innerHTML = words.map((w, i) => `<tr style="border-bottom:1px solid #eee"><td style="padding:10px">${i+1}</td><td style="padding:10px">${w}</td></tr>`).join('');
        document.getElementById('preview-modal').style.display = "block";
    }

    function closePreview() { document.getElementById('preview-modal').style.display = "none"; }

    function generateShareLink(isWhatsapp) {
        const words = document.getElementById('word-input-area').value.split(/[ ,]+/).filter(w => w.length > 0).join(',');
        const title = document.getElementById('list-title').value.trim() || "Spelling Challenge";
        const rate = document.getElementById('speech-rate').value;
        const pitch = document.getElementById('speech-pitch').value;
        const shuffle = document.getElementById('shuffle-check').checked ? 1 : 0;
        
        if (!words) return alert("Enter some words to share!");
        const url = `${window.location.origin}${window.location.pathname}?words=${encodeURIComponent(words)}&title=${encodeURIComponent(title)}&rate=${rate}&pitch=${pitch}&shuffle=${shuffle}`;
        
        if (isWhatsapp) {
            const text = `🏆 *Spelling Challenge* 🏆\nList: *${title}*\n\nThink you can get 100%?\nPlay here: ${url}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        } else {
            navigator.clipboard.writeText(url).then(() => alert("Link copied to clipboard!"));
        }
    }

    function startGame() {
        let words = document.getElementById('word-input-area').value.split(/[ ,]+/).filter(w => w.length > 0);
        if (words.length === 0) return alert("Please enter words.");
        
        if (document.getElementById('shuffle-check').checked) {
            words = words.sort(() => Math.random() - 0.5);
        }
        targetWords = words;

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('current-game-title').innerText = document.getElementById('list-title').value || "Spelling Test";
        
        const container = document.getElementById('word-list-container');
        container.innerHTML = targetWords.map((word, i) => `
            <div class="word-row">
                <span style="font-weight:bold; width:25px;">${i+1}.</span>
                <button onclick="speak('${word}')" style="cursor:pointer; padding:8px 12px; border:1px solid #ccc; border-radius:6px; background:white">🔊 Listen</button>
                <input type="text" class="word-input" id="guess-${i}" autocomplete="off" placeholder="...">
            </div>
        `).join('');
        
        startTimer();
    }

    function startTimer() {
        let sec = 0;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            sec++;
            document.getElementById('timer-display').innerText = `Time: ${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
        }, 1000);
    }

    function speak(word) {
        const utt = new SpeechSynthesisUtterance(word);
        utt.rate = document.getElementById('speech-rate').value;
        utt.pitch = document.getElementById('speech-pitch').value;
        window.speechSynthesis.speak(utt);
    }

    function finishGame() {
        clearInterval(timerInterval);
        let score = 0;
        targetWords.forEach((word, i) => {
            const el = document.getElementById(`guess-${i}`);
            if (el.value.trim().toLowerCase() === word.toLowerCase()) {
                el.className = 'word-input correct'; score++;
            } else {
                el.className = 'word-input wrong'; el.value += ` (Correct: ${word})`;
            }
        });
        
        const scoreDiv = document.getElementById('score-display');
        scoreDiv.innerHTML = `<div style="font-size:1.6em; font-weight:bold;">Final Score: ${score} / ${targetWords.length}</div>`;
        
        if (score === targetWords.length && targetWords.length > 0) {
            scoreDiv.innerHTML += `<div style="color:var(--success); font-weight:bold;">PERFECT SCORE! 🌟</div>`;
            triggerConfetti();
        }
    }

    function triggerConfetti() {
        const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'];
        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(confetti);

            const animation = confetti.animate([
                { top: '-10px', opacity: 1 },
                { top: '100vh', opacity: 0, transform: `rotate(${Math.random() * 1000}deg)` }
            ], {
                duration: Math.random() * 3000 + 2000,
                easing: 'cubic-bezier(0, .9, .57, 1)'
            });

            animation.onfinish = () => confetti.remove();
        }
    }

    function resetGame() {
        clearInterval(timerInterval);
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('game-section').classList.add('hidden');
        document.getElementById('score-display').innerText = "";
    }

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('words')) {
            document.getElementById('word-input-area').value = decodeURIComponent(params.get('words')).replace(/,/g, ', ');
            document.getElementById('list-title').value = decodeURIComponent(params.get('title') || '');
            document.getElementById('speech-rate').value = params.get('rate') || 1;
            document.getElementById('speech-pitch').value = params.get('pitch') || 1;
            document.getElementById('shuffle-check').checked = params.get('shuffle') === '1';
            updateLabels();
        }
    };
</script>
</body>
</html>
